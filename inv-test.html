<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inventaire NetRack — EO / PBC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#141a1f;
  --papier:#f2f0eb;
  --carton:#e3dfd5;
  --trait:#c8c3b6;
  --gris:#6c6a63;
  --eo:#1d6fa5;
  --pbc:#b8531f;
  --alerte:#9c2b2b;
  --ok:#3d6b3f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papier);
  color:var(--encre);
  font-family:Inter,system-ui,sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,.ecran-vide h2{font-family:'Barlow Condensed',Impact,sans-serif;letter-spacing:.02em;margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- Connexion ---------- */
#connexion{
  min-height:100dvh;display:grid;place-items:center;padding:24px;
}
.carte-connexion{
  width:min(380px,100%);background:#fff;border:1px solid var(--trait);
  padding:28px;
}
.carte-connexion h1{font-size:30px;text-transform:uppercase;line-height:1}
.carte-connexion .sous{color:var(--gris);font-size:12px;margin:6px 0 22px;letter-spacing:.06em;text-transform:uppercase}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin-bottom:5px}
input,select{
  width:100%;padding:9px 10px;border:1px solid var(--trait);background:#fff;
  font-family:inherit;font-size:14px;color:inherit;border-radius:0;
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--encre);outline-offset:1px}
.champ{margin-bottom:14px}
button{
  font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.06em;
  text-transform:uppercase;padding:10px 16px;border:1px solid var(--encre);
  background:var(--encre);color:var(--papier);cursor:pointer;border-radius:0;
}
button.secondaire{background:transparent;color:var(--encre)}
button:disabled{opacity:.45;cursor:not-allowed}
.erreur{color:var(--alerte);font-size:13px;margin-top:12px;min-height:18px}

/* ---------- Entête ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--papier);
  border-bottom:1px solid var(--trait);
}
.bandeau{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:12px 18px 8px}
.bandeau h1{font-size:22px;text-transform:uppercase}
.horodatage{font-size:11px;color:var(--gris);letter-spacing:.05em}
.bandeau .droite{margin-left:auto;display:flex;gap:8px;align-items:center}

.filtres{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:0 18px 12px}
.filtres .champ{margin:0}
.filtres .recherche{flex:1 1 260px;min-width:200px}
.filtres select{min-width:120px}

/* Puces client — la colonne client est le pivot de l'outil */
.puces{display:flex;border:1px solid var(--trait);background:#fff}
.puce{
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;
  font-size:15px;padding:9px 14px;background:transparent;color:var(--gris);
  border:0;border-right:1px solid var(--trait);
}
.puce:last-child{border-right:0}
.puce[aria-pressed="true"]{background:var(--encre);color:var(--papier)}
.puce[data-client="EO"][aria-pressed="true"]{background:var(--eo);border-color:var(--eo)}
.puce[data-client="PBC"][aria-pressed="true"]{background:var(--pbc);border-color:var(--pbc)}

.compteurs{display:flex;gap:18px;padding:0 18px 10px;font-size:12px;color:var(--gris);letter-spacing:.04em}
.compteurs b{font-family:'JetBrains Mono',monospace;color:var(--encre);font-weight:700}

/* ---------- Tableau ---------- */
.zone{padding:0 18px 40px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  position:sticky;top:0;background:var(--carton);text-align:left;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.07em;
  text-transform:uppercase;padding:7px 8px;border-bottom:1px solid var(--trait);
  white-space:nowrap;cursor:pointer;user-select:none;
}
thead th .fleche{color:var(--gris);font-size:10px}
tbody tr{border-bottom:1px solid var(--carton);cursor:pointer}
tbody tr:hover{background:#fff}
tbody tr.ouverte{background:#fff}
td{padding:6px 8px;vertical-align:top}
td.num{text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
td.desc{max-width:340px}
/* Signature : la tranche colorée qui identifie le client au coup d'œil */
td.tranche{
  padding:0;width:52px;position:relative;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;
  color:#fff;text-align:center;
}
td.tranche span{display:block;padding:6px 0}
tr[data-client="EO"] td.tranche span{background:var(--eo)}
tr[data-client="PBC"] td.tranche span{background:var(--pbc)}
tr.perime td.exp{color:var(--alerte);font-weight:600}

.detail td{background:#fff;padding:12px 14px 16px}
.grille-detail{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 20px}
.grille-detail div{font-size:12px}
.grille-detail dt{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
.grille-detail dd{margin:2px 0 0;font-family:'JetBrains Mono',monospace}

.ecran-vide{text-align:center;padding:70px 20px;color:var(--gris)}
.ecran-vide h2{font-size:22px;text-transform:uppercase;color:var(--encre);margin-bottom:6px}
.plus{display:block;margin:18px auto}
.cache{display:none}
@media (prefers-reduced-motion:no-preference){
  tbody tr{transition:background .12s ease}
}
@media (max-width:640px){
  td.desc{max-width:none}
  .zone{padding:0 8px 40px}
  .bandeau,.filtres,.compteurs{padding-left:10px;padding-right:10px}
}
</style>
</head>
<body>

<!-- ============ CONNEXION ============ -->
<section id="connexion">
  <div class="carte-connexion">
    <h1>Inventaire NetRack</h1>
    <p class="sous">EO &middot; PBC — accès réservé</p>
    <div class="champ">
      <label for="courriel">Courriel</label>
      <input id="courriel" type="email" autocomplete="username">
    </div>
    <div class="champ">
      <label for="motdepasse">Mot de passe</label>
      <input id="motdepasse" type="password" autocomplete="current-password">
    </div>
    <button id="btn-connexion" style="width:100%">Se connecter</button>
    <p class="erreur" id="erreur-connexion"></p>
  </div>
</section>

<!-- ============ APPLICATION ============ -->
<main id="appli" class="cache">
  <header>
    <div class="bandeau">
      <h1>Inventaire NetRack</h1>
      <span class="horodatage" id="horodatage"></span>
      <div class="droite">
        <button class="secondaire" id="btn-csv">Exporter CSV</button>
        <button class="secondaire" id="btn-recharger">Recharger</button>
        <button class="secondaire" id="btn-deconnexion">Quitter</button>
      </div>
    </div>

    <div class="filtres">
      <div class="puces" role="group" aria-label="Filtrer par client">
        <button class="puce" data-client="" aria-pressed="true">Tous</button>
        <button class="puce" data-client="EO" aria-pressed="false">EO</button>
        <button class="puce" data-client="PBC" aria-pressed="false">PBC</button>
      </div>
      <div class="champ recherche">
        <label for="recherche">Rechercher — produit, description, lot, étiquette, commande</label>
        <input id="recherche" type="search" placeholder="ex. 4021, palette bleue, LOT-338…" autocomplete="off">
      </div>
      <div class="champ">
        <label for="f-entrepot">Entrepôt</label>
        <select id="f-entrepot"><option value="">Tous</option></select>
      </div>
      <div class="champ">
        <label for="f-division">Division</label>
        <select id="f-division"><option value="">Toutes</option></select>
      </div>
      <div class="champ">
        <label for="f-stock">Stock</label>
        <select id="f-stock">
          <option value="">Tout</option>
          <option value="dispo">Disponible seulement</option>
          <option value="bloque">Avec quantité bloquée</option>
          <option value="perime">Expiré ou expire sous 30 j</option>
        </select>
      </div>
    </div>

    <div class="compteurs">
      <span><b id="c-lignes">0</b> lignes affichées</span>
      <span><b id="c-produits">0</b> produits distincts</span>
      <span><b id="c-dispo">0</b> unités disponibles</span>
    </div>
  </header>

  <div class="zone">
    <table id="tableau">
      <thead>
        <tr>
          <th data-tri="client">Client</th>
          <th data-tri="no_produit">Produit</th>
          <th data-tri="description">Description</th>
          <th data-tri="entrepot">Entr.</th>
          <th data-tri="no_lot">Lot</th>
          <th data-tri="unite1_qte_inv" class="num">Qté U1</th>
          <th data-tri="unite1_type">U1</th>
          <th data-tri="unite1_disponibles" class="num">Dispo U1</th>
          <th data-tri="unite2_qte_inv" class="num">Qté U2</th>
          <th data-tri="unite2_type">U2</th>
          <th data-tri="date_expiration">Expiration</th>
        </tr>
      </thead>
      <tbody id="corps"></tbody>
    </table>
    <div id="etat" class="ecran-vide"><h2>Chargement</h2><p>Lecture de l'inventaire…</p></div>
    <button class="plus secondaire cache" id="btn-plus">Afficher 300 lignes de plus</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ─────────────────────────────────────────────
// Configuration
// ─────────────────────────────────────────────
const SUPABASE_URL = "https://xppzmdmnuztozgukrcta.supabase.co";
const SUPABASE_CLE  = "sb_publishable_pj0u4TSJNMqQ6h_HBDasqQ_aDYfjJfc";
const TABLE = "n8n_gh_inventaire";
const PAR_PAGE = 300;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_CLE);

const $ = s => document.querySelector(s);
let toutes = [];      // toutes les lignes chargées
let filtrees = [];    // lignes après filtres
let affichees = 0;
let tri = { colonne: "no_produit", sens: 1 };
let filtreClient = "";

// ─────────────────────────────────────────────
// Connexion
// ─────────────────────────────────────────────
async function connecter(){
  const btn = $("#btn-connexion");
  btn.disabled = true;
  $("#erreur-connexion").textContent = "";
  const { error } = await sb.auth.signInWithPassword({
    email: $("#courriel").value.trim(),
    password: $("#motdepasse").value
  });
  btn.disabled = false;
  if (error){
    $("#erreur-connexion").textContent =
      error.message.includes("Invalid") ? "Courriel ou mot de passe incorrect." : error.message;
    return;
  }
  demarrer();
}
$("#btn-connexion").addEventListener("click", connecter);
["#courriel","#motdepasse"].forEach(s =>
  $(s).addEventListener("keydown", e => { if (e.key === "Enter") connecter(); })
);

$("#btn-deconnexion").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

// ─────────────────────────────────────────────
// Chargement des données (par tranches de 1000)
// ─────────────────────────────────────────────
async function charger(){
  $("#etat").innerHTML = "<h2>Chargement</h2><p>Lecture de l'inventaire…</p>";
  $("#etat").style.display = "";
  toutes = [];
  let debut = 0;
  const TAILLE = 1000;
  while (true){
    const { data, error } = await sb.from(TABLE)
      .select("*").range(debut, debut + TAILLE - 1);
    if (error){
      $("#etat").innerHTML =
        "<h2>Lecture impossible</h2><p>" + error.message + "</p>";
      return;
    }
    toutes = toutes.concat(data);
    if (data.length < TAILLE) break;
    debut += TAILLE;
  }
  remplirListes();
  $("#horodatage").textContent =
    "Relevé chargé le " + new Date().toLocaleString("fr-CA");
  appliquer();
}

function remplirListes(){
  const remplir = (sel, champ) => {
    const valeurs = [...new Set(toutes.map(l => l[champ]).filter(Boolean))].sort();
    const el = $(sel);
    const premier = el.options[0];
    el.innerHTML = "";
    el.appendChild(premier);
    valeurs.forEach(v => {
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      el.appendChild(o);
    });
  };
  remplir("#f-entrepot", "entrepot");
  remplir("#f-division", "division");
}

// ─────────────────────────────────────────────
// Filtres, tri, rendu
// ─────────────────────────────────────────────
const nombre = v => {
  const n = parseFloat(String(v ?? "").replace(/[\s,]/g, "").replace(",", "."));
  return isNaN(n) ? 0 : n;
};
const dateDe = v => {
  if (!v) return null;
  const m = String(v).match(/(\d{4})[-/](\d{2})[-/](\d{2})/) ||
            String(v).match(/(\d{2})[-/](\d{2})[-/](\d{4})/);
  if (!m) return null;
  return m[1].length === 4
    ? new Date(+m[1], +m[2]-1, +m[3])
    : new Date(+m[3], +m[2]-1, +m[1]);
};

function appliquer(){
  const q = $("#recherche").value.trim().toLowerCase();
  const entrepot = $("#f-entrepot").value;
  const division = $("#f-division").value;
  const stock = $("#f-stock").value;
  const dans30 = new Date(Date.now() + 30*86400000);

  filtrees = toutes.filter(l => {
    if (filtreClient && l.client !== filtreClient) return false;
    if (entrepot && l.entrepot !== entrepot) return false;
    if (division && l.division !== division) return false;
    if (stock === "dispo" && nombre(l.unite1_disponibles) <= 0) return false;
    if (stock === "bloque" && nombre(l.unite1_bloques) <= 0) return false;
    if (stock === "perime"){
      const d = dateDe(l.date_expiration);
      if (!d || d > dans30) return false;
    }
    if (q){
      const foin = [l.no_produit, l.description, l.no_lot, l.no_sous_lot,
                    l.etiquette, l.no_comm_client, l.division]
                    .join(" ").toLowerCase();
      if (!q.split(/\s+/).every(mot => foin.includes(mot))) return false;
    }
    return true;
  });

  const num = ["unite1_qte_inv","unite1_disponibles","unite1_bloques",
               "unite2_qte_inv","unite2_disponibles","unite2_bloques"];
  filtrees.sort((a,b) => {
    const A = a[tri.colonne], B = b[tri.colonne];
    if (num.includes(tri.colonne)) return (nombre(A) - nombre(B)) * tri.sens;
    return String(A ?? "").localeCompare(String(B ?? ""), "fr", {numeric:true}) * tri.sens;
  });

  $("#c-lignes").textContent = filtrees.length.toLocaleString("fr-CA");
  $("#c-produits").textContent =
    new Set(filtrees.map(l => l.client + "|" + l.no_produit)).size.toLocaleString("fr-CA");
  $("#c-dispo").textContent =
    Math.round(filtrees.reduce((s,l) => s + nombre(l.unite1_disponibles), 0)).toLocaleString("fr-CA");

  affichees = 0;
  $("#corps").innerHTML = "";
  rendre();
}

function rendre(){
  const dans30 = new Date(Date.now() + 30*86400000);
  const lot = filtrees.slice(affichees, affichees + PAR_PAGE);
  const frag = document.createDocumentFragment();

  lot.forEach(l => {
    const tr = document.createElement("tr");
    tr.dataset.client = l.client || "";
    const exp = dateDe(l.date_expiration);
    if (exp && exp <= dans30) tr.classList.add("perime");
    tr.innerHTML = `
      <td class="tranche"><span>${l.client || "—"}</span></td>
      <td class="mono">${txt(l.no_produit)}</td>
      <td class="desc">${txt(l.description)}</td>
      <td class="mono">${txt(l.entrepot)}</td>
      <td class="mono">${txt(l.no_lot)}</td>
      <td class="num">${txt(l.unite1_qte_inv)}</td>
      <td>${txt(l.unite1_type)}</td>
      <td class="num">${txt(l.unite1_disponibles)}</td>
      <td class="num">${txt(l.unite2_qte_inv)}</td>
      <td>${txt(l.unite2_type)}</td>
      <td class="mono exp">${txt(l.date_expiration)}</td>`;
    tr.addEventListener("click", () => basculerDetail(tr, l));
    frag.appendChild(tr);
  });

  $("#corps").appendChild(frag);
  affichees += lot.length;

  $("#etat").style.display = filtrees.length ? "none" : "";
  if (!filtrees.length){
    $("#etat").innerHTML =
      "<h2>Aucun résultat</h2><p>Élargis la recherche ou remets les filtres à zéro.</p>";
  }
  $("#btn-plus").classList.toggle("cache", affichees >= filtrees.length);
  $("#btn-plus").textContent =
    "Afficher " + Math.min(PAR_PAGE, filtrees.length - affichees) + " lignes de plus";
}

const txt = v => (v === null || v === undefined || v === "") ? "—" :
  String(v).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

const ETIQUETTES = {
  division:"Division", no_produit:"N° produit", description:"Description",
  unite1_qte_inv:"U1 — qté inv.", unite1_type:"U1 — type",
  unite1_exped_att:"U1 — expéd. attente", unite1_bloques:"U1 — bloqués",
  unite1_disponibles:"U1 — disponibles",
  unite2_qte_inv:"U2 — qté inv.", unite2_type:"U2 — type",
  unite2_exped_att:"U2 — expéd. attente", unite2_bloques:"U2 — bloqués",
  unite2_disponibles:"U2 — disponibles",
  no_comm_client:"N° commande client", entrepot:"Entrepôt", etiquette:"Étiquette",
  no_lot:"N° lot", no_sous_lot:"N° sous-lot", date_lot:"Date lot",
  date_expiration:"Expiration", date_reception_originale:"Réception originale"
};

function basculerDetail(tr, l){
  const suivante = tr.nextElementSibling;
  if (suivante && suivante.classList.contains("detail")){
    suivante.remove(); tr.classList.remove("ouverte"); return;
  }
  document.querySelectorAll("tr.detail").forEach(e => e.remove());
  document.querySelectorAll("tr.ouverte").forEach(e => e.classList.remove("ouverte"));
  tr.classList.add("ouverte");
  const ligne = document.createElement("tr");
  ligne.className = "detail";
  const cases = Object.keys(ETIQUETTES)
    .map(k => `<div><dt>${ETIQUETTES[k]}</dt><dd>${txt(l[k])}</dd></div>`).join("");
  ligne.innerHTML = `<td colspan="11"><dl class="grille-detail">${cases}</dl></td>`;
  tr.after(ligne);
}

// ─────────────────────────────────────────────
// Export CSV
// ─────────────────────────────────────────────
function exporterCsv(){
  const colonnes = ["client", ...Object.keys(ETIQUETTES)];
  const echapper = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lignes = [colonnes.join(";")].concat(
    filtrees.map(l => colonnes.map(c => echapper(l[c])).join(";"))
  );
  const blob = new Blob(["\ufeff" + lignes.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "inventaire-netrack-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─────────────────────────────────────────────
// Écouteurs
// ─────────────────────────────────────────────
let minuteur;
$("#recherche").addEventListener("input", () => {
  clearTimeout(minuteur); minuteur = setTimeout(appliquer, 180);
});
["#f-entrepot","#f-division","#f-stock"].forEach(s =>
  $(s).addEventListener("change", appliquer));

document.querySelectorAll(".puce").forEach(p =>
  p.addEventListener("click", () => {
    filtreClient = p.dataset.client;
    document.querySelectorAll(".puce").forEach(a =>
      a.setAttribute("aria-pressed", String(a === p)));
    appliquer();
  }));

document.querySelectorAll("thead th").forEach(th =>
  th.addEventListener("click", () => {
    const c = th.dataset.tri;
    tri.sens = (tri.colonne === c) ? -tri.sens : 1;
    tri.colonne = c;
    document.querySelectorAll("thead th .fleche").forEach(f => f.remove());
    const f = document.createElement("span");
    f.className = "fleche";
    f.textContent = tri.sens === 1 ? " ▲" : " ▼";
    th.appendChild(f);
    appliquer();
  }));

$("#btn-plus").addEventListener("click", rendre);
$("#btn-csv").addEventListener("click", exporterCsv);
$("#btn-recharger").addEventListener("click", charger);

// ─────────────────────────────────────────────
// Démarrage
// ─────────────────────────────────────────────
function demarrer(){
  $("#connexion").classList.add("cache");
  $("#appli").classList.remove("cache");
  charger();
}

sb.auth.getSession().then(({ data }) => { if (data.session) demarrer(); });
</script>
</body>
</html>
